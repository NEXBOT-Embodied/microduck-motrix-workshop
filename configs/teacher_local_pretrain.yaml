# 本机教师预训练试配：512环境，batch512×4更新；8192000条交互不保证走稳。
course:
  title: 上海张江谋先飞 12 月 6 日小鸭子教学
  task: microduck-course-flat
  base_task: microduck-walk-flat
  simulator: motrixsim
  algorithm: motrix.fastsac
  upstream_commit: 1ddb9743c220c3a1e234ea0237d5ce9cc56d0499
  upstream_path: upstream/MotrixLab
runtime:
  seed: 42
  num_envs: 512
  play_num_envs: 1
  additional_iterations: 16000
  device: cuda
  cpu_threads: 4
  logging_interval: 200
  checkpoint_interval: 1000
  capacity_status: teacher_local_pretraining_not_student_quota
fastsac:
  asynchronous: false
  agent:
    compile: false
    amp: false
    buffer_size: 1024
    batch_size: 512
    num_updates: 4
    learning_starts: 64
evaluation:
  preset: forward_walk_trial
  command:
  - 0.15
  - 0.0
  - 0.0
  seed: 42
  status: unverified_trial_not_walking_acceptance
paths:
  policies: configs/policies.yaml
  outputs: outputs/training_outputs
  submissions: submissions
acceptance:
  walking_policy_status: not_yet_trained
  image_status: preparation_only
  sim2sim_status: second_engine_not_selected
